<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/Sistema/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/Sistema/favicon-16.png" />
    <link rel="shortcut icon" href="/Sistema/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/Sistema/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2C1219" />
    <link rel="preload" as="image" href="/marca/leve/acenando.webp" type="image/webp" />
    <meta name="description" content="Gestão inteligente para confeitarias" />
    <!-- PWA no iOS (instalação na tela inicial como app nativo) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Doonly" />
    <link rel="manifest" href="/manifest.json" />
    <title>Doonly - Confeitaria Inteligente</title>
  </head>
  <body>
    <script>
      // Se é rota de cardápio público (/c/xxx), NÃO mostra a abertura do Doonly
      // — cliente da confeitaria não deve ver a marca Doonly na abertura.
      (function () {
        var p = window.location.pathname || '';
        if (p.indexOf('/c/') === 0 || p.indexOf('/cardapio/') === 0) {
          document.documentElement.setAttribute('data-no-splash', '1');
        }
      })();
    </script>
    <!-- Abertura (07/10): a mesma tela do começo ao fim, no fundo vinho do login. Fica FORA do #root: o app carrega por baixo
         e a abertura some quando ele está pronto (src/lib/abertura.ts), sem trocar de imagem nem pular de lugar. -->
    <div id="abertura" role="status" aria-label="Carregando o Doonly">
      <div class="ab-meio">
        <img class="ab-masc" src="/marca/leve/acenando.webp" alt="" width="512" height="598" />
        <img class="ab-nome" src="/marca/leve/texto.webp" alt="Doonly" width="640" height="256" />
        <div class="ab-pontos" aria-hidden="true"><i></i><i></i><i></i></div>
      </div>
      <p class="ab-frase">Sua confeitaria organizada, do pedido ao lucro</p>
    </div>
    <div id="root"></div>
    <style>
      html{background:#2C1219}
      #abertura{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:radial-gradient(1000px 640px at 50% 38%,#4B1528 0%,#2C1219 72%);transition:opacity .25s ease-out}
      #abertura.saindo{opacity:0;pointer-events:none}
      html[data-no-splash] #abertura{display:none !important}
      html[data-no-splash]{background:#fff}
      .ab-meio{display:flex;flex-direction:column;align-items:center;transform:translateY(-4%)}
      .ab-masc{display:block;width:136px;height:auto;filter:drop-shadow(0 0 16px rgba(255,157,196,.55)) drop-shadow(0 8px 10px rgba(0,0,0,.35))}
      .ab-nome{display:block;width:128px;height:auto;margin-top:12px;filter:brightness(0) invert(1)}
      .ab-pontos{display:flex;gap:8px;margin-top:28px}
      .ab-pontos i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.85);animation:abPonto 1.1s ease-in-out infinite}
      .ab-pontos i:nth-child(2){animation-delay:.15s}.ab-pontos i:nth-child(3){animation-delay:.3s}
      @keyframes abPonto{0%,80%,100%{transform:scale(.6);opacity:.5}40%{transform:scale(1);opacity:1}}
      .ab-frase{position:absolute;left:0;right:0;bottom:calc(28px + env(safe-area-inset-bottom,0px));margin:0;padding:0 16px;text-align:center;text-wrap:balance;line-height:1.4;font-family:Geist,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:13px;font-weight:500;color:rgba(255,255,255,.72)}
      @media (min-width:768px){.ab-masc{width:170px}.ab-nome{width:210px;margin-top:14px}.ab-pontos{margin-top:32px}}
      @media (max-height:500px){.ab-masc{width:96px}.ab-nome{width:104px;margin-top:8px}.ab-pontos{margin-top:16px}.ab-frase{bottom:calc(12px + env(safe-area-inset-bottom,0px))}}
      @media (prefers-reduced-motion:reduce){.ab-pontos i{animation:none;opacity:.85;transform:none}#abertura{transition:none}}
    </style>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js');
        });
      }
    </script>
  </body>
</html>
