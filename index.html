<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/Sistema/favicon-doo-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/Sistema/favicon-doo-16.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/Sistema/favicon-doo-48.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/Sistema/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#22130E" />
    <link rel="preload" as="image" href="/marca/leve/bolo-coroa.webp" type="image/webp" />
    <link rel="preload" as="font" href="/fonts/Poppins-400.woff2" type="font/woff2" crossorigin />
    <link rel="preload" as="font" href="/fonts/Poppins-600.woff2" type="font/woff2" crossorigin />
    <meta name="description" content="Gestão inteligente para confeitarias" />
    <!-- PWA no iOS (instalação na tela inicial como app nativo) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Doonly" />
    <link rel="manifest" href="/manifest.json" />
    <title>Doonly · Sistema para confeitarias</title>
    <!-- (22/10) console no celular: abra com ?debug=1 no endereço (ex.: doonly.com.br/inicio?debug=1) e aparece a engrenagem do Eruda -->
    <script>
      (function () {
        try {
          var liga = /[?&]debug=1/.test(location.search);
          if (liga) sessionStorage.setItem("doonly_debug", "1");
          if (!liga && sessionStorage.getItem("doonly_debug") !== "1") return;
          var s = document.createElement("script");
          s.src = "https://cdn.jsdelivr.net/npm/eruda@3.4.1/eruda.js";
          s.onload = function () { window.eruda && window.eruda.init(); };
          document.head.appendChild(s);
        } catch (e) { /* sem debug */ }
      })();
    </script>
  </head>
  <body>
    <script>
      // Se é rota de cardápio público (/c/xxx), NÃO mostra a abertura do Doonly
      // — cliente da confeitaria não deve ver a marca Doonly na abertura.
      (function () {
        var p = window.location.pathname || '';
        if (p.indexOf('/c/') === 0 || p.indexOf('/cardapio/') === 0) {
          document.documentElement.setAttribute('data-no-splash', '1');
        }
      })();
    </script>
    <!-- Abertura (07/10): a mesma tela do começo ao fim, no fundo vinho do login. Fica FORA do #root: o app carrega por baixo
         e a abertura some quando ele está pronto (src/lib/abertura.ts), sem trocar de imagem nem pular de lugar. -->
    <div id="abertura" role="status" aria-label="Carregando o Doonly">
      <div class="ab-meio">
        <img class="ab-masc" src="/marca/leve/bolo-coroa.webp" alt="" width="337" height="360" />
        <div class="ab-mais">
          <img class="ab-nome" src="/marca/leve/texto.webp" alt="Doonly" width="640" height="256" />
          <div class="ab-pontos" aria-hidden="true"><i></i><i></i><i></i></div>
        </div>
      </div>
      <p class="ab-frase">Sua confeitaria organizada, do pedido ao lucro</p>
    </div>
    <div id="root"></div>
    <style>
      html{background:#22130E}
      /* (25/10) igual à abertura do Android (fundo chocolate liso e o bolinho de coroa no meio), para as duas parecerem uma tela só.
         O nome, os pontinhos e a frase só aparecem se o app demorar para carregar. */
      #abertura{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#22130E;transition:opacity .25s ease-out}
      #abertura.saindo{opacity:0;pointer-events:none}
      html[data-no-splash] #abertura{display:none !important}
      html[data-no-splash]{background:#fff}
      .ab-meio{position:relative;display:flex;flex-direction:column;align-items:center}
      .ab-masc{display:block;width:148px;height:auto}
      .ab-mais{position:absolute;top:100%;left:50%;display:flex;flex-direction:column;align-items:center;transform:translateX(-50%);opacity:0;animation:abAparece .3s ease-out .8s forwards}
      .ab-nome{display:block;width:118px;height:auto;margin-top:18px;filter:brightness(0) invert(1)}
      .ab-pontos{display:flex;gap:8px;margin-top:22px}
      .ab-pontos i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.85);animation:abPonto 1.1s ease-in-out infinite}
      .ab-pontos i:nth-child(2){animation-delay:.15s}.ab-pontos i:nth-child(3){animation-delay:.3s}
      @keyframes abPonto{0%,80%,100%{transform:scale(.6);opacity:.5}40%{transform:scale(1);opacity:1}}
      @keyframes abAparece{to{opacity:1}}
      .ab-frase{position:absolute;left:0;right:0;bottom:calc(28px + env(safe-area-inset-bottom,0px));margin:0;padding:0 16px;text-align:center;text-wrap:balance;line-height:1.4;font-family:Poppins,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:13px;font-weight:500;color:rgba(255,255,255,.72);opacity:0;animation:abAparece .3s ease-out .8s forwards}
      @media (min-width:768px){.ab-masc{width:170px}.ab-nome{width:170px}}
      @media (max-height:500px){.ab-masc{width:96px}.ab-nome{width:96px;margin-top:8px}.ab-pontos{margin-top:12px}.ab-frase{bottom:calc(12px + env(safe-area-inset-bottom,0px))}}
      @media (prefers-reduced-motion:reduce){.ab-pontos i{animation:none;opacity:.85;transform:none}#abertura{transition:none}.ab-mais,.ab-frase{animation:none;opacity:1}}
      /* plano B (11/10): o app não carregou */
      .ab-erro{max-width:280px;margin:24px 0 0;text-align:center;line-height:1.4;font-family:Poppins,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;font-weight:500;color:#fff}
      .ab-botao{min-height:48px;margin-top:16px;padding:0 24px;border:0;border-radius:12px;background:#fff;color:#22130E;font-family:Poppins,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;font-weight:700;cursor:pointer}
      #plano-b{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:#fff;text-align:center;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;font-weight:500;line-height:1.4;color:#333}
      #plano-b button{min-height:48px;margin-top:16px;padding:0 24px;border:0;border-radius:12px;background:#222;color:#fff;font:inherit;font-weight:700;cursor:pointer}
    </style>
    <script>
      // (19/10) arquivo do app que não existe mais (o app ficou aberto durante uma atualização): recarrega uma vez
      // pra pegar a versão nova, em vez de ficar com a tela em branco. No máximo uma vez a cada 30 s.
      (function () {
        function recarregar() {
          try {
            var ult = Number(sessionStorage.getItem('doonly_recarga_arquivo') || 0);
            if (Date.now() - ult < 30000) return;
            sessionStorage.setItem('doonly_recarga_arquivo', String(Date.now()));
          } catch (e) {}
          window.location.reload();
        }
        window.addEventListener('error', function (e) {
          var el = e && e.target;
          var src = el && (el.src || el.href);
          if (src && /\/assets\//.test(src) && (el.tagName === 'SCRIPT' || el.tagName === 'LINK')) recarregar();
        }, true);
        window.addEventListener('vite:preloadError', function (e) { e.preventDefault(); recarregar(); });
        window.addEventListener('unhandledrejection', function (e) {
          var m = String((e && e.reason && e.reason.message) || '');
          if (/dynamically imported module|Importing a module script failed|Failed to load module script|error loading dynamically/i.test(m)) recarregar();
        });
      })();
    </script>
    <script>
      // Plano B da abertura (11/10): se o arquivo principal do app não carregar (internet caiu no meio, arquivo antigo
      // que não existe mais), a abertura ficava presa pra sempre, porque o limite de 8 s vive dentro desse arquivo.
      // Depois de 12 s sem o app na tela, aparece o aviso com "Tentar de novo". Se o app carregar depois, ele assume.
      setTimeout(function () {
        var raiz = document.getElementById('root');
        if (raiz && raiz.firstChild) return; // o app já está na tela
        var frase = 'Não deu pra abrir. Confira a internet.';
        var botao = document.createElement('button');
        botao.type = 'button';
        botao.textContent = 'Tentar de novo';
        botao.onclick = function () { window.location.reload(); };
        var ab = document.getElementById('abertura');
        if (ab && !document.documentElement.hasAttribute('data-no-splash')) {
          if (ab.className.indexOf('saindo') >= 0) return;
          var meio = ab.querySelector('.ab-mais') || ab.querySelector('.ab-meio');
          var pontos = ab.querySelector('.ab-pontos');
          var embaixo = ab.querySelector('.ab-frase');
          if (!meio) return;
          if (pontos) pontos.style.display = 'none';
          if (embaixo) embaixo.style.display = 'none';
          var p = document.createElement('p');
          p.className = 'ab-erro';
          p.textContent = frase;
          botao.className = 'ab-botao';
          meio.appendChild(p);
          meio.appendChild(botao);
          ab.setAttribute('role', 'alert');
          ab.setAttribute('aria-label', frase);
          return;
        }
        // cardápio da cliente (sem a abertura do Doonly): aviso simples, sem a marca
        var b = document.createElement('div');
        b.id = 'plano-b';
        b.setAttribute('role', 'alert');
        b.appendChild(document.createTextNode(frase));
        b.appendChild(botao);
        document.body.appendChild(b);
        if (raiz && window.MutationObserver) new MutationObserver(function () { if (raiz.firstChild) b.remove(); }).observe(raiz, { childList: true });
      }, 12000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js');
        });
      }
    </script>
  </body>
</html>
