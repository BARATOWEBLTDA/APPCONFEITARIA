<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/ic1.png" />
    <link rel="apple-touch-icon" href="/ic1.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3d1a24" />
    <meta name="description" content="Gestão inteligente para confeitarias" />
    <link rel="manifest" href="/manifest.json" />
    <title>Doonly - Gestão para Confeitarias</title>
  </head>
  <body>
    <div id="root">
      <div id="html-splash" style="position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;background:linear-gradient(135deg,#986274 0%,#6E3548 50%,#C39EAA 100%);">
        <img src="/logoapp.png" alt="Doonly" style="width:150px;object-fit:contain;filter:drop-shadow(0 8px 24px rgba(0,0,0,0.25));animation:sp 1.6s ease-in-out infinite;" />
        <p style="position:absolute;bottom:2.5rem;font-family:sans-serif;font-size:0.82rem;font-weight:500;color:rgba(255,255,255,0.75);letter-spacing:0.1em;text-transform:uppercase;margin:0;">Gestão para Confeitarias</p>
      </div>
    </div>
    <style>#html-splash img{animation:sp 1.6s ease-in-out infinite}@keyframes sp{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}</style>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js');
        });
      }
    </script>
  </body>
</html>
