# (21/11) Baixa as fotos dos ingredientes do produto que vai aparecer no vídeo da ficha técnica (/pro2).
# Só roda neste ramo. As fotos ficam na pasta gravacao/ing deste mesmo ramo.
name: Baixar fotos da ficha
on:
  push:
    branches: [gravar-cardapio]
    paths: [".github/gravar/imagens.txt", ".github/workflows/gravar-cardapio.yml"]
permissions:
  contents: write
jobs:
  baixar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p gravacao/ing
          while read -r nome url; do
            [ -z "$nome" ] && continue
            curl -sL --max-time 40 -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130 Safari/537.36" -o "gravacao/ing/$nome" "$url" || echo "falhou $nome"
            file "gravacao/ing/$nome" | cut -c1-90
          done < .github/gravar/imagens.txt
      - run: |
          git config user.name "gravador" && git config user.email "gravador@users.noreply.github.com"
          git add gravacao && git commit -qm "fotos dos ingredientes da ficha" && git push -q
