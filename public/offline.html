<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2C1219">
<title>Sem internet · Doonly</title>
<style>
  /* Página "sem internet" do Doonly (10/10): aparece quando o app é aberto sem conexão,
     no lugar da página de erro do navegador. Mesmo desenho das telas de conta. */
  @font-face { font-family: Geist; src: url('/fonts/Geist-Medium.woff2') format('woff2'); font-weight: 500; font-display: swap; }
  @font-face { font-family: Geist; src: url('/fonts/Geist-Bold.woff2') format('woff2'); font-weight: 700; font-display: swap; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; align-items: center; justify-content: center; padding: calc(env(safe-area-inset-top, 0px) + 110px) 16px calc(env(safe-area-inset-bottom, 0px) + 24px);
    background: radial-gradient(1000px 640px at 50% 38%, #4B1528 0%, #2C1219 72%) #2C1219; font-family: Geist, system-ui, -apple-system, 'Segoe UI', sans-serif; color: #2C1219; -webkit-text-size-adjust: 100%; }
  main { position: relative; width: 100%; max-width: 420px; padding: 56px 24px 26px; background: #FFFFFF; border-radius: 22px; box-shadow: 0 14px 40px -12px rgba(60, 10, 30, .45); text-align: center; }
  .masc { position: absolute; left: 50%; top: -96px; transform: translateX(-50%); width: 136px; height: auto; pointer-events: none; filter: drop-shadow(0 0 16px rgba(255, 157, 196, .55)) drop-shadow(0 8px 10px rgba(0, 0, 0, .35)); }
  .nome { display: block; width: 128px; height: auto; margin: 0 auto 10px; }
  h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.01em; line-height: 1.25; text-wrap: balance; }
  p { max-width: 320px; margin: 6px auto 22px; font-size: 14px; font-weight: 500; line-height: 1.5; color: #6B5D64; text-wrap: balance; }
  button { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 52px; margin: 0; padding: 0 20px; border: 0; border-radius: 13px; background: #E85A8C; color: #FFFFFF;
    box-shadow: 0 3px 0 #C33A6E; font-family: inherit; font-size: 15px; font-weight: 700; line-height: 1.2; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:active { transform: translateY(2px); box-shadow: 0 1px 0 #C33A6E; }
  button:focus-visible { outline: 3px solid rgba(232, 90, 140, .45); outline-offset: 2px; }
  @media (max-width: 380px) { main { padding-inline: 18px; } }
</style>
</head>
<body>
  <main>
    <img class="masc" src="/marca/leve/senha.webp" alt="" aria-hidden="true" onerror="this.remove()">
    <img class="nome" src="/marca/leve/texto.webp" alt="Doonly" onerror="this.remove()">
    <h1>Você está sem internet</h1>
    <p>Confira o Wi-Fi ou os dados do celular. Assim que a conexão voltar, o Doonly abre sozinho.</p>
    <button type="button" id="tentar">Tentar de novo</button>
  </main>
  <script>
    document.getElementById('tentar').addEventListener('click', function () { location.reload(); });
    window.addEventListener('online', function () { location.reload(); });
  </script>
</body>
</html>
