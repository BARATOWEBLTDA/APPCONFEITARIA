<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 438 884" width="438" height="884" fill="none">
  <!--
    Moldura do celular — Doonly Landing (desenho próprio, 11/11)
    Área da tela (transparente): x=16 y=12 largura=406 altura=860 raio=46
    Se trocar esta moldura, ajuste dl-tela-x, dl-tela-y, dl-tela-l, dl-tela-a e dl-tela-raio no landing.css.
  -->
  <defs>
    <!-- titânio grafite: brilho nas duas bordas -->
    <linearGradient id="ti" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2E262A"/><stop offset="1" stop-color="#2E262A"/></linearGradient>
    <linearGradient id="tiV" x1="0" y1="0" x2="0" y2="884" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".45"/>
      <stop offset=".018" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset=".982" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".28"/>
    </linearGradient>
    <linearGradient id="bt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9A8E94"/>
      <stop offset=".45" stop-color="#4E4449"/>
      <stop offset="1" stop-color="#241D21"/>
    </linearGradient>
    <linearGradient id="btD" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#241D21"/>
      <stop offset=".55" stop-color="#4E4449"/>
      <stop offset="1" stop-color="#A69AA0"/>
    </linearGradient>
    <!-- reflexo do vidro: faixa diagonal bem suave -->
    <linearGradient id="vidro" x1="8" y1="4" x2="430" y2="880" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".16"/>
      <stop offset=".22" stop-color="#FFFFFF" stop-opacity=".05"/>
      <stop offset=".34" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset=".62" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset=".7" stop-color="#FFFFFF" stop-opacity=".04"/>
      <stop offset=".78" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lente" cx=".35" cy=".35" r=".8">
      <stop offset="0" stop-color="#2F3A58"/>
      <stop offset=".55" stop-color="#0E1220"/>
      <stop offset="1" stop-color="#05060B"/>
    </radialGradient>
    <mask id="furo" maskUnits="userSpaceOnUse" x="0" y="0" width="438" height="884">
      <rect width="438" height="884" fill="#fff"/>
      <rect x="16" y="12" width="406" height="860" rx="46" fill="#000"/>
    </mask>
    <clipPath id="frente">
      <rect x="8" y="4" width="422" height="876" rx="56"/>
    </clipPath>
  </defs>

  <!-- botões: ação e volume (esquerda), lateral (direita) -->
  <rect x="0.5" y="168" width="5.5" height="34" rx="2.5" fill="url(#bt)"/>
  <rect x="0.5" y="230" width="5.5" height="62" rx="2.5" fill="url(#bt)"/>
  <rect x="0.5" y="304" width="5.5" height="62" rx="2.5" fill="url(#bt)"/>
  <rect x="432" y="258" width="5.5" height="100" rx="2.5" fill="url(#btD)"/>
  <rect x="432" y="560" width="5" height="56" rx="2.5" fill="url(#btD)" fill-opacity=".85"/>

  <g mask="url(#furo)">
    <!-- aro de titânio -->
    <rect x="4" y="0" width="430" height="884" rx="60" fill="url(#ti)"/>
    
    <rect x="4.5" y="0.5" width="429" height="883" rx="59.5" stroke="#FFFFFF" stroke-opacity=".28"/>
    <!-- linhas de antena -->
    <rect x="70" y="0" width="2.5" height="4" fill="#120D10" fill-opacity=".55"/>
    <rect x="365" y="880" width="2.5" height="4" fill="#120D10" fill-opacity=".55"/>
    <rect x="4" y="96" width="4" height="2.5" fill="#120D10" fill-opacity=".55"/>
    <rect x="430" y="786" width="4" height="2.5" fill="#120D10" fill-opacity=".55"/>
    <!-- vidro da frente (borda preta fina) -->
    <rect x="8" y="4" width="422" height="876" rx="56" fill="#040203"/>
    <rect x="8.5" y="4.5" width="421" height="875" rx="55.5" stroke="#000" stroke-opacity=".8"/>
  </g>
  <rect x="9" y="5" width="420" height="874" rx="55" stroke="#FFFFFF" stroke-opacity=".1"/>
  <rect x="16.5" y="12.5" width="405" height="859" rx="45.5" stroke="#000" stroke-opacity=".4"/>

  <!-- ilha da câmera -->
  <rect x="169" y="24" width="100" height="30" rx="15" fill="#020102"/>
  <circle cx="251" cy="39" r="6" fill="url(#lente)"/>
  <circle cx="249.6" cy="37.6" r="1.5" fill="#6B7BAE" fill-opacity=".6"/>
</svg>
